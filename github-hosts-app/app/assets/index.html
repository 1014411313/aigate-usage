<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub 加速</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px calc(28px + env(safe-area-inset-bottom));background:#0f1115;color:#e6e8ee;
  font:14px/1.6 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif}
h1{font-size:17px;margin:4px 0 14px}
.card{background:#171a21;border:1px solid #232733;border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:600;color:#8b93a7;margin:0 0 10px;letter-spacing:.3px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #21252f}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.name{font-weight:600}
.url{font-size:12px;color:#79819a;word-break:break-all}
.desc{font-size:12px;color:#5f6678;margin-top:2px}
button{font:inherit;border:0;border-radius:9px;padding:10px 14px;background:#2f6fed;color:#fff;font-weight:600}
button.ghost{background:#232733;color:#c7ccdb}
button.danger{background:transparent;color:#e0605e;padding:8px 10px}
button:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:110px}
input{font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid #2b303c;background:#0f1115;color:#e6e8ee}
label.f{display:block;font-size:12px;color:#8b93a7;margin:10px 0 5px}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;background:#333a48;border-radius:13px;transition:.15s}
.sw i:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+i{background:#2f6fed}
.sw input:checked+i:after{transform:translateX(18px)}
pre{background:#0b0d11;border:1px solid #21252f;border-radius:9px;padding:10px;margin:0;font-size:12px;
  max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.kv span:first-child{color:#8b93a7}
.tag{font-size:12px;padding:2px 8px;border-radius:20px;background:#232733;color:#8b93a7}
.tag.ok{background:#123524;color:#4ec97e}
.tag.bad{background:#3a1c1c;color:#e0605e}
.muted{color:#79819a;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>GitHub 加速</h1>

<div class="card">
  <h2>状态</h2>
  <div class="kv"><span>最后更新</span><b id="stTime">—</b></div>
  <div class="kv"><span>hosts 条目</span><b id="stCount">—</b></div>
  <div class="kv"><span>root 权限</span><b id="stRoot"><span class="tag">—</span></b></div>
  <div class="kv"><span>github.com</span><b id="stNet"><span class="tag">未测</span></b></div>
  <div class="btns" style="margin-top:12px">
    <button id="btnUpdate">立即更新</button>
    <button id="btnApply" class="ghost">应用到系统</button>
    <button id="btnTest" class="ghost">测试连通性</button>
    <button id="btnCheck" class="ghost">检查更新</button>
    <button id="btnRestore" class="ghost">撤销挂载</button>
  </div>
  <div class="muted" id="out">自动更新：每 12 小时一次（需授予 root）</div>
</div>

<div class="card">
  <h2>源（多源合并，按域名去重）</h2>
  <div id="srcList"></div>
</div>

<div class="card">
  <h2>添加源</h2>
  <label class="f">名称</label>
  <input id="newName" placeholder="例如 我的源">
  <label class="f">URL（hosts 格式）</label>
  <input id="newUrl" placeholder="https://...">
  <button id="btnAdd" style="margin-top:10px">添加</button>
</div>

<div class="card">
  <h2>GitHub 下载加速</h2>
  <label class="f">GitHub 链接（Release / raw / 仓库文件）</label>
  <input id="dlUrl" placeholder="https://github.com/owner/repo/releases/download/...">
  <button id="btnProbe" style="margin-top:10px">测速并列出镜像</button>
  <div id="mirrorList" style="margin-top:6px"></div>
  <div class="muted" id="dlOut">下载的文件会保存到系统「下载」目录</div>
</div>

<div class="card">
  <h2>日志</h2>
  <pre id="log">加载中…</pre>
  <button id="btnReloadLog" class="ghost" style="margin-top:10px;width:100%">刷新日志</button>
</div>

<script>
var A = window.Android;
var $ = function (id) { return document.getElementById(id); };
var busy = false;

function setOut(text) { $('out').textContent = text; }

function setBusy(on) {
  busy = on;
  $('btnUpdate').disabled = on;
  $('btnApply').disabled = on;
  $('btnTest').disabled = on;
  $('btnCheck').disabled = on;
  $('btnProbe').disabled = on;
}

/* ---- 与 Java 桥交互 ---- */
function loadSources() {
  try { return JSON.parse(A.sources() || '[]'); } catch (e) { return []; }
}
function saveSources(list) { A.saveSources(JSON.stringify(list, null, 2)); }
function loadDisabled() {
  return new Set((A.disabled() || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean));
}
function saveDisabled(set) {
  var arr = [];
  set.forEach(function (v) { arr.push(v); });
  A.saveDisabled(arr.join('\n') + (arr.length ? '\n' : ''));
}

/* 带过滤器的源用它自己的 key，否则同一个 URL 的多个源无法分别开关 */
function srcKey(s) { return s.filter ? (s.url + '|' + s.filter) : s.url; }

/* ---- 结果回调（Java 侧异步调用） ---- */
window.__onResult = function (kind, text) {
  setBusy(false);
  if (kind === 'update') {
    setOut(text);
    refresh();
  } else if (kind === 'apply' || kind === 'restore') {
    setOut(text);
    refreshLog();
  } else if (kind === 'net') {
    $('stNet').innerHTML = text === 'OK'
      ? '<span class="tag ok">可达</span>'
      : '<span class="tag bad">不可达</span>';
  } else if (kind === 'checkup') {
    if (text.indexOf('FAIL') === 0) {
      setOut(text);
    } else {
      try {
        var u = JSON.parse(text);
        if (u.hasNew) {
          setOut('发现新版本 ' + u.latest + '（当前 ' + u.current + '），已把下载链接填到下面「GitHub 下载加速」');
          $('dlUrl').value = u.apk || u.page || '';
          if ($('dlUrl').value) { $('dlUrl').scrollIntoView({ block: 'center' }); }
        } else {
          setOut('已是最新版本 ' + u.current);
        }
      } catch (e) {
        setOut('检查结果解析失败');
      }
    }
  } else if (kind === 'probe') {
    var list = [];
    try { list = JSON.parse(text || '[]'); } catch (e) { list = []; }
    renderMirrors(list);
    $('dlOut').textContent = '测速完成，选一个下载';
  } else if (kind === 'download') {
    $('dlOut').textContent = text;
    refreshLog();
  }
};

function renderMirrors(list) {
  var box = $('mirrorList');
  box.textContent = '';
  if (!list.length) {
    box.innerHTML = '<div class="muted">没有可用镜像</div>';
    return;
  }
  list.sort(function (a, b) { return (b.speed || 0) - (a.speed || 0); });
  list.forEach(function (m) {
    var row = document.createElement('div');
    row.className = 'row';

    var grow = document.createElement('div');
    grow.className = 'grow';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = m.name || '镜像';
    var meta = document.createElement('div');
    meta.className = 'url';
    meta.textContent = m.ok
      ? (Math.round((m.speed || 0) / 1024) + ' KB/s · ' + m.ms + ' ms')
      : '不可用';
    grow.append(name, meta);

    var btn = document.createElement('button');
    btn.textContent = '下载';
    btn.disabled = !m.ok;
    btn.addEventListener('click', function () {
      if (busy) return;
      setBusy(true);
      $('dlOut').textContent = '下载中…';
      A.downloadUrl(m.url);
    });

    row.append(grow, btn);
    box.append(row);
  });
}

/* ---- 渲染 ---- */
function renderSources() {
  var list = loadSources();
  var disabled = loadDisabled();
  var box = $('srcList');
  box.textContent = '';
  if (!list.length) {
    box.innerHTML = '<div class="muted">没有源，请添加。</div>';
    return;
  }
  list.forEach(function (src, idx) {
    var row = document.createElement('div');
    row.className = 'row';

    var grow = document.createElement('div');
    grow.className = 'grow';
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = src.name || '未命名';
    var url = document.createElement('div');
    url.className = 'url';
    url.textContent = src.url || '';
    grow.append(name, url);
    if (src.desc) {
      var desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = src.desc;
      grow.append(desc);
    }

    var sw = document.createElement('label');
    sw.className = 'sw';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    var key = srcKey(src);
    cb.checked = !disabled.has(key);
    cb.addEventListener('change', function () {
      var d = loadDisabled();
      if (cb.checked) { d.delete(key); } else { d.add(key); }
      saveDisabled(d);
    });
    var knob = document.createElement('i');
    sw.append(cb, knob);

    var del = document.createElement('button');
    del.className = 'danger';
    del.textContent = '删除';
    del.addEventListener('click', function () {
      var l = loadSources();
      l.splice(idx, 1);
      saveSources(l);
      renderSources();
    });

    row.append(grow, sw, del);
    box.append(row);
  });
}

function refresh() {
  var st;
  try { st = JSON.parse(A.status() || '{}'); } catch (e) { st = {}; }
  $('stTime').textContent = st.time || '—';
  $('stCount').textContent = (st.count === undefined ? '—' : st.count);
  $('stRoot').innerHTML = st.root
    ? '<span class="tag ok">可用</span>'
    : '<span class="tag bad">不可用</span>';
}

function refreshLog() {
  var log = A.log() || '';
  var el = $('log');
  el.textContent = log.trim() || '暂无日志';
  el.scrollTop = el.scrollHeight;
}

/* ---- 事件 ---- */
$('btnUpdate').addEventListener('click', function () {
  if (busy) return;
  setBusy(true);
  setOut('正在更新…');
  A.update();
});

$('btnApply').addEventListener('click', function () {
  if (busy) return;
  setBusy(true);
  setOut('正在应用…');
  A.apply();
});

$('btnTest').addEventListener('click', function () {
  if (busy) return;
  setBusy(true);
  $('stNet').innerHTML = '<span class="tag">测试中</span>';
  A.testNet();
});

$('btnRestore').addEventListener('click', function () {
  if (busy) return;
  setBusy(true);
  setOut('正在撤销…');
  A.restore();
});

$('btnAdd').addEventListener('click', function () {
  var name = $('newName').value.trim();
  var url = $('newUrl').value.trim();
  if (!/^https?:\/\//.test(url)) { setOut('URL 必须以 http(s):// 开头'); return; }
  var list = loadSources();
  list.push({ name: name || url, url: url });
  saveSources(list);
  $('newName').value = '';
  $('newUrl').value = '';
  renderSources();
  setOut('已添加，点「立即更新」生效');
});

$('btnCheck').addEventListener('click', function () {
  if (busy) return;
  setBusy(true);
  setOut('检查更新中…');
  A.checkUpdate();
});

$('btnReloadLog').addEventListener('click', refreshLog);

$('btnProbe').addEventListener('click', function () {
  var url = $('dlUrl').value.trim();
  if (!/^https?:\/\//.test(url)) { $('dlOut').textContent = '请先填一个 http(s) 链接'; return; }
  if (busy) return;
  setBusy(true);
  $('mirrorList').textContent = '';
  $('dlOut').textContent = '测速中…';
  A.probe(url);
});

try {
  renderSources();
  refresh();
  refreshLog();
} catch (e) {
  setOut('初始化失败：' + e.message);
}
</script>
</body>
</html>
