# 二改声明：本文件来自「电池解容工具箱 v3.9.6」（作者 听夜风1337），
# 已整合进「HyperOS 动态温控 K2」（作者 Axiaojiux）的二改整合版，非原作者官方发布。
# 电池解容工具箱 配置文件
# unlock: 解容总开关 1=开 0=关
# fv_guard: smart_fv守护 1=开 0=关
# pss_disable: 低电量锁容服务 1=禁用 0=启用
#   【这是解容的第 3 步】unlock.sh 的解容流程 = 挂 BAA + 启 fv/cycle 守护 +
#   **禁用 PSS** + 重启 batteryantiaging。禁用 PSS 用于防止系统在低电量时锁容。
#   ⚠ 代价：PSS 被禁用后 com.miui.securitycenter.remote 进程不启动 →
#     BatteryHealthUtils 不运行 → 设置里的「电池健康度」不显示（真机实测）。
#   ⇒ 想要健康度显示的用户把它改成 0（代价：低电量锁容防护失效）。
#   默认保持 1，与解容设计一致。
# cycle_fake: 循环伪装目标值 空=不干预
unlock=1
fv_guard=1
pss_disable=1
# pss_low_soc: 【PSS 动态模式】只在电量 ≤ 该值时禁用 PSS，其余时间启用。
#   0 = 关闭动态模式（旧行为：一直禁用 PSS）。
#   【为什么需要它】解容第 3 步要禁用 PSS（防低电量锁容），但 PSS 被禁后
#     com.miui.securitycenter.remote 不启动 → BatteryHealthUtils 不运行 →
#     设置里的「电池健康度」不显示（真机实测）。
#   「锁容」是低电量行为，所以把它设为 20~30 就能两全：
#     · 低电量时 PSS 禁用 → 仍防锁容
#     · 平时 PSS 启用 → 电池健康度正常显示
#   pss_low_hyst: 解禁回差（%）。SOC 回到 low_soc+hyst 以上才重新启用 PSS，
#     避免在阈值附近反复切换。
pss_low_soc=25
pss_low_hyst=5
cycle_fake=
backup_dir=/sdcard/Download/dtbo_backup

# power_limit: 充电模式 inf=不限速(全速) / fast=40W MAX / mid=25W MAX / slow=10W MAX
#（各档实际落点由 common.sh 顶部的【机型参数表】决定；下面几项可选，用于现场标定）
power_limit=inf

# 可选：现场标定（去掉行首 # 生效；默认按机型参数表）
# fast_w=40       # fast 档目标瓦数（单电流模式：电池电流≈节点电流，线性精确）
# mid_w=25        # mid 档目标瓦数（单电流模式：电池电流≈节点电流，线性精确）
# slow_w=10       # slow 档目标瓦数
# mid_ctrl=4      # （兼容旧机制）ctrl 阶梯落点
# slow_ctrl=14    # （兼容旧机制）ctrl 阶梯落点
# power_mech=curr # curr=单电流模式(th0+ctrl0+电流目标，默认) / ctrl=旧ctrl阶梯(兼容)
# max_ma=8000     # 电流安全上限(mA)，默认按机型表(xuanyuan/haotian 8000[对8A硬顶] / dada 12000 / nezha 8000 / myron·annibale·popsicle 9000 / miro 10250 / songyuan 9200 / warsaw 9000 / bixi 6500 / onyx 8000 / pudding 9200)

# cloud_guard: 云控屏蔽 1=开 (BAA云端下发被跳过+云端目录巡检隔离) / 0=关 (允许云端下发)
cloud_guard=1

# thermal_guard: 温控守护 1=开 0=关（判据=电池温度 ≥上限 -> 执行动作；回落 上限-hyst 自动恢复。板温仅显示）
# ★ v2.7.5 起【默认关闭】—— 由用户在 WebUI 里按需求自行开启。
#   原因：解容后 DTBO 把满速区间放宽到 ~57℃，高温段没有兜底；
#         但"是否要这层护栏"取决于用户自己的使用场景（边充边玩 / 夜间充电 / 高温环境），
#         不该由安装时替用户决定。安装后想开就去 WebUI 温控卡片右上角打开。
# thermal_limit: 温度上限（℃）
# thermal_hyst: 恢复滞回（℃）
# thermal_action: 触发动作（v2.7 新增 fast）
#   slow=降档慢充(10W) / mid=降档中速(25W) / fast=降档快充(40W) / stop=停止充电(约2W)
#   实际压到多少 W 由 settings 的 slow_w / mid_w / fast_w 决定（默认 10 / 25 / 40）
#   （restore=还原官方策略 已于 v2.6.21 移除；旧配置会自动映射为 slow）
thermal_guard=0
thermal_limit=45
thermal_hyst=4
thermal_action=slow

# freepps: 公版PPS解锁（实验性）1=开 / 0=关
#   作用：伪造 pd_verifed=1，解除米系对「公版 PD/PPS 充电器」的验证限制，
#         让不支持小米金标协议的第三方头（酷态科等）不被限功率；含金标动画广播。
#   ★ 什么时候该开：只有【第三方 PD/PPS 充电头】功率上不去时才需要开。
#   ★ 官方小米充电头：走小米私有协议（不是公版 PPS），本来就【不需要】开。
#      官方 100W 以下的头可能被适配器自己协商到 PPS 档位，那是充电头行为，与开关无关。
#      —— 若用官方头且已开此开关、又觉得功率异常，先关掉再对比。
#   ★ 关掉时会自动把 pd_verifed 还原为 0（v2.7.7 起即使进程已死也能还原）；
#      若怀疑残留，执行：su -c "sh <模块>/scripts/freepps.sh restore"
#   ===== v2.10.5 【实测结论：别再信上面第 66-68 行，以这段为准】=====
#     作者真机实测：**开公版 PPS 时实际功率比走小米私有协议更激进**。
#     机制：真正的作用不是"多给电"，而是【唤醒快充状态机】
#           （charging_stage 从 0 变成 9）。不开时状态机空闲，
#           所有 DTBO 功率参数根本没人消费 —— 这才是"改参数没效果"的真因。
#     实测：freepps=0 → 40.1W；freepps=1 → 48.4W（同一电量区间，+22%）。
#     ⚠ v2.10.1~v2.10.4 曾有 scripts/charge_proto.sh 强写
#       strategy_pd_auth/verified=1（把适配器认证成小米原厂 → 推回私有路径），
#       方向是反的，v2.10.5 已整个删除。
#   ===== v3.0.0 【发布策略：默认关闭】=====
#     v3.0.0 是公用发行版，按作者决定默认 freepps=0：
#       · 新装用户：默认 0，需要时在 WebUI 手动开（说明见 README）
#       · 升级用户：freepps 已放回 customize.sh 的 _MIG_KEYS，
#                   **完全沿用你原来的设置**，不会被本版默认值覆盖
#     ⇒ 想要那 +22%：WebUI 打开「公版 PPS 解锁」→ **拔插一次充电器**。
freepps=0
# baa_fmt: BAA载荷格式 auto=自动探测(推荐) / enc=强制加密 / plain=强制明文
baa_fmt=auto

# cg_min_write_gap: 【全局限流】两次"真实写电流节点"之间的最小间隔（秒）
#   ★ 这是防"功率 0W↔50W 锯齿"的最后一道硬下限。
#   为什么需要：每次写 wired_chg_curr 都会让 PMIC 重新协商 PD/PPS 契约，
#     适配器侧电压/电流抖动 → 功率瞬间塌陷再爬升。旧版的 60 秒节流时间戳会被
#     "切档/拔插/Charging↔Full 跳变"等清旗路径删掉 → 等于没有下限保护。
#     ≥80% 电量时电池会在 Charging↔Full 反复跳变（CV 段），旧版每次都清旗，
#     于是反复写 → 反复重协商 —— 这就是"高电量反而有波形、功率低"的机制。
#   本值默认 60（秒）。调小会更激进（响应快但可能出波形），调大更保守。
#   排障时可临时调小；若出现功率波形，调大或保持默认。
cg_min_write_gap=60
# cg_disc_min_sec: 判定「真拔枪」所需的放电持续秒数（<此值视为 OVP/JEITA 抖动，不清安顿旗）
cg_disc_min_sec=5

# thermal_ceil: 【温控总闸关闭阈值】单位 0.1℃（550 = 55.0℃）
#   ★ v2.7.9 新增。含义：电池温度 ≥ 此值时，模块把 wired/wireless_thermal_remove
#     置 0，把温度保护交回驱动 DT 温控表。
#   【为什么改】v2.7.8 及以前硬编码 500（50.0℃），而模块改的 DTBO 里 temp_para1 是
#     【满流到 55℃（部分机型 57℃）才归零】——50℃ 落在满流区间之内，
#     于是模块提前关闸 → 驱动把电流压到 ~0.5A（约 2W）
#     → 温度在 50℃ 附近来回 → 功率 59W ↔ 0.5W 方波 + PD 契约反复重协商
#     实测（xuanyuan，9% 电量 60W 充电）：vbus 19.40V ↔ 8.99V，功率 59.0W ↔ 0.5W
#     dmesg 实锤：mca_charger_thermal_sysfs_store:550 set wired thermal remove: 0
#                 （进程号即 charge_guard）
#   【默认值】留空 = 按机型自动取（实测自 13 个机型的 DTBO temp_para1）：
#       55℃ : xuanyuan haotian dada nezha myron annibale bixi
#       57℃ : miro onyx popsicle pudding songyuan warsaw
#   【想更保守】可自己填小一点（如 500 = 50.0℃ 恢复旧行为），代价是低电量
#     高功率充电时会出现功率方波。
thermal_ceil=

# dev_code: 机型代号（安装时自动识别并写入: xuanyuan|dada|haotian|nezha|myron|annibale|bixi|onyx|popsicle|miro|songyuan|warsaw|pudding）
dev_code=

# 电池电压（volt_guard）
#   fv_v     满电电压 mV，4300~4600，留空=关闭。超过 BAA 载荷 vterm 上限时必须开 fv_force
#   term_v   关机电压 mV，2800~3500，留空=关闭（OS4 无内核节点，由模块软件检测后关机）
#   fv_force 1=强制改写 BAA 载荷 vterm 突破原厂上限（会重加密并重挂载；硬件 OVP 仍会拦截）
fv_v=
term_v=
fv_force=0
