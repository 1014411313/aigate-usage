<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperOS - 液态玻璃UI</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* ================= 三种风格的主题变量 ================= */
        
        /* 风格一：极光浅色 (Aurora Light) */
        .theme-light {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fdf4ff 50%, #e0e7ff 100%);
            --glass-bg: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent: #f59e0b;
            --accent-bg: rgba(245, 158, 11, 0.15);
            --nav-bg: rgba(255, 255, 255, 0.5);
        }

        /* 风格二：暗黑霓虹 (Dark Neon) */
        .theme-dark {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --accent-bg: rgba(56, 189, 248, 0.15);
            --nav-bg: rgba(15, 23, 42, 0.6);
        }

        /* 风格三：全息流体 (Holographic Fluid) */
        .theme-fluid {
            --bg-gradient: linear-gradient(45deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --text-main: #111827;
            --text-sub: #4b5563;
            --accent: #ec4899;
            --accent-bg: rgba(236, 72, 153, 0.15);
            --nav-bg: rgba(255, 255, 255, 0.3);
        }

        /* ================= 背景与容器 ================= */
        .bg-ambient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            background-size: 200% 200%;
            animation: gradientShift 10s ease infinite alternate;
            z-index: -1;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* 手机外壳模拟 */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 850px;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 8px solid rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            background: var(--bg-gradient);
            color: var(--text-main);
            transition: all 0.5s ease;
        }

        /* ================= 顶部状态栏 ================= */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            font-size: 12px;
            font-weight: 600;
            z-index: 10;
            color: var(--text-main);
        }
        
        .status-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* ================= 头部标题 ================= */
        .header {
            padding: 10px 24px 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* ================= 主内容滚动区 ================= */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 100px;
            scrollbar-width: none; /* 隐藏滚动条 */
        }
        .content::-webkit-scrollbar { display: none; }

        /* 玻璃卡片通用样式 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05), 
                        inset 0 1px 0 0 var(--glass-highlight);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* 实时运行面板 */
        .panel-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
        }

        .dot {
            width: 8px; height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #10b981;
        }

        /* 环形主视觉 */
        .circle-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0 30px;
        }

        .circle-wrap {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-wrap svg {
            position: absolute;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: var(--accent-bg);
            stroke-width: 12;
        }

        .circle-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 565; /* 2 * pi * 90 */
            stroke-dashoffset: 140; /* 控制进度 */
            filter: drop-shadow(0 0 8px var(--accent));
            transition: stroke 0.5s ease;
        }

        .power-text {
            text-align: center;
            z-index: 2;
        }

        .power-value {
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
        }

        .power-unit {
            font-size: 14px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        .btn-unlimited {
            margin-top: 16px;
            background: var(--accent-bg);
            color: var(--accent);
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 数据网格 */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
        }

        .data-val {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .data-label {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 400;
        }

        /* 主电池信息卡片 */
        .battery-main-card {
            padding: 20px 10px;
            margin-bottom: 12px;
        }

        /* ================= 底部导航栏 ================= */
        .bottom-nav {
            position: absolute;
            bottom: 24px;
            left: 20px;
            right: 20px;
            height: 72px;
            background: var(--nav-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1), inset 0 1px 0 var(--glass-highlight);
            z-index: 20;
            transition: all 0.5s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ================= 主题切换悬浮按钮 ================= */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 999;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .theme-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .theme-btn:hover { transform: scale(1.1); }
        .theme-btn.active { border-color: #fff; }
        .btn-light { background: linear-gradient(135deg, #e0f2fe, #fdf4ff); }
        .btn-dark { background: linear-gradient(135deg, #0f172a, #1e1b4b); }
        .btn-fluid { background: linear-gradient(135deg, #ff9a9e, #a1c4fd); }

    </style>
</head>
<body class="theme-light">

    <!-- 背景流光 -->
    <div class="bg-ambient"></div>

    <!-- 主题切换器 -->
    <div class="theme-switcher">
        <div class="theme-btn btn-light active" onclick="setTheme('theme-light', this)"></div>
        <div class="theme-btn btn-dark" onclick="setTheme('theme-dark', this)"></div>
        <div class="theme-btn btn-fluid" onclick="setTheme('theme-fluid', this)"></div>
    </div>

    <!-- 手机应用容器 -->
    <div class="app-container">
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>20:24</span>
            <div class="status-right">
                <span>5G</span>
                <span>🔋 89</span>
            </div>
        </div>

        <!-- 头部 -->
        <div class="header">
            <h1>HyperOS - 动态温控·解密</h1>
            <p>心之所向的你 是否也于我同频</p>
        </div>

        <!-- 滚动内容区 -->
        <div class="content">
            
            <!-- 实时运行面板 -->
            <div class="glass-card panel-header">
                <div class="dot"></div>
                <span>实时运行面板</span>
            </div>

            <!-- 环形主视图 -->
            <div class="circle-section">
                <div class="circle-wrap">
                    <svg width="200" height="200">
                        <circle class="circle-bg" cx="100" cy="100" r="90"></circle>
                        <!-- 140 offset 约为 75% 进度 -->
                        <circle class="circle-progress" cx="100" cy="100" r="90"></circle>
                    </svg>
                    <div class="power-text">
                        <div class="power-value">5.2</div>
                        <div class="power-unit">W</div>
                    </div>
                </div>
                <button class="btn-unlimited">无限制</button>
            </div>

            <!-- 电量与状态 -->
            <div class="grid-2">
                <div class="glass-card data-item">
                    <span class="data-val">100</span>
                    <span class="data-label">电量 %</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">放电中</span>
                    <span class="data-label">状态</span>
                </div>
            </div>

            <!-- 容量信息 -->
            <div class="glass-card grid-3 battery-main-card">
                <div class="data-item">
                    <span class="data-val">6100</span>
                    <span class="data-label">设计容量 mAh</span>
                </div>
                <div class="data-item">
                    <span class="data-val">5001</span>
                    <span class="data-label">满充容量 mAh</span>
                </div>
                <div class="data-item">
                    <span class="data-val">82</span>
                    <span class="data-label">健康度 %</span>
                </div>
            </div>

            <!-- 实时参数 -->
            <div class="grid-3">
                <div class="glass-card data-item">
                    <span class="data-val">4.556</span>
                    <span class="data-label">电压 V</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">1.13</span>
                    <span class="data-label">电流 A</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">41.6</span>
                    <span class="data-label">温度 °C</span>
                </div>
            </div>

            <!-- 电池其他信息 -->
            <div class="grid-3">
                <div class="glass-card data-item">
                    <span class="data-val">733</span>
                    <span class="data-label">循环次数</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">1</span>
                    <span class="data-label">伪装次数</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">PPS</span>
                    <span class="data-label">充电协议</span>
                </div>
            </div>

        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l7.2 14.2H4.8L12 5.8z"/></svg>
                <span>主页</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 16a4 4 0 100-8 4 4 0 000 8zm0 2a6 6 0 110-12 6 6 0 010 12zm0-16a6 6 0 110 12 6 6 0 010-12z"/></svg>
                <span>温控</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 4h-2V2H9v2H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V6a2 2 0 00-2-2zm-2 14H9v-2h6v2zm0-4H9v-2h6v2zm0-4H9V8h6v2z"/></svg>
                <span>电池</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2a8 8 0 100-16 8 8 0 000 16zm-3-8a2 2 0 110-4 2 2 0 010 4zm6 0a2 2 0 110-4 2 2 0 010 4z"/></svg>
                <span>外观</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span>关于</span>
            </div>
        </div>

    </div>

    <!-- 切换主题的JS逻辑 -->
    <script>
        function setTheme(themeName, btnElement) {
            // 移除 body 上的所有主题类
            document.body.className = themeName;
            
            // 更新按钮激活状态
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
