<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperOS - 极致艳丽液态玻璃UI</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* ================= 绚丽的动态背景光斑 ================= */
        .ambient-background {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.8;
            animation: float 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 默认：幻彩极光风格 (Aurora) 的色块 */
        .blob-1 { width: 60vw; height: 60vw; background: #ff00cc; top: -10%; left: -10%; }
        .blob-2 { width: 50vw; height: 50vw; background: #3333ff; bottom: -10%; right: -10%; animation-delay: -4s; }
        .blob-3 { width: 70vw; height: 70vw; background: #00ffff; top: 30%; left: 20%; animation-delay: -8s; mix-blend-mode: screen; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 15%) scale(1.2); }
        }

        /* ================= 主题变量定义 ================= */

        /* 风格一：幻彩极光 (极致艳丽) */
        .theme-aurora {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-highlight: rgba(255, 255, 255, 0.6);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --accent: #00e5ff;
            --accent-bg: rgba(0, 229, 255, 0.15);
            --nav-bg: rgba(255, 255, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        /* 风格二：赛博霓虹 (暗黑高级) */
        .theme-cyber {
            --glass-bg: rgba(10, 10, 15, 0.5);
            --glass-border: rgba(0, 255, 136, 0.25);
            --glass-highlight: rgba(0, 255, 136, 0.4);
            --text-main: #ffffff;
            --text-sub: rgba(0, 255, 136, 0.6);
            --accent: #00ff88;
            --accent-bg: rgba(0, 255, 136, 0.1);
            --nav-bg: rgba(10, 10, 15, 0.6);
            --shadow-color: rgba(0, 255, 136, 0.1);
        }
        /* 修改背景光斑颜色 */
        .theme-cyber .blob-1 { background: #ff0055; opacity: 0.6;}
        .theme-cyber .blob-2 { background: #0055ff; opacity: 0.6;}
        .theme-cyber .blob-3 { background: #00ff88; opacity: 0.4;}

        /* 风格三：熔岩鎏金 (奢华质感) */
        .theme-lava {
            --glass-bg: rgba(30, 20, 20, 0.25);
            --glass-border: rgba(255, 200, 100, 0.3);
            --glass-highlight: rgba(255, 200, 100, 0.6);
            --text-main: #fff5e6;
            --text-sub: rgba(255, 200, 100, 0.7);
            --accent: #ffaa00;
            --accent-bg: rgba(255, 170, 0, 0.15);
            --nav-bg: rgba(30, 20, 20, 0.3);
            --shadow-color: rgba(0, 0, 0, 0.4);
        }
        .theme-lava .blob-1 { background: #ff3300; }
        .theme-lava .blob-2 { background: #ffaa00; }
        .theme-lava .blob-3 { background: #6600ff; }


        /* ================= 手机外壳与容器 ================= */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 390px;
            height: 840px;
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 0 0 10px #111, 0 30px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            color: var(--text-main);
            transition: color 0.5s ease;
            /* 极微弱的内部噪点增加质感 */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* ================= 状态栏 ================= */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            font-size: 13px;
            font-weight: 600;
            z-index: 10;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* ================= 头部标题 ================= */
        .header {
            padding: 10px 28px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 500;
        }

        /* ================= 滚动内容 ================= */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 100px;
            scrollbar-width: none;
        }
        .content::-webkit-scrollbar { display: none; }

        /* ================= 极致液态玻璃卡片 ================= */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(200%) contrast(110%);
            -webkit-backdrop-filter: blur(30px) saturate(200%) contrast(110%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: 
                0 10px 30px -10px var(--shadow-color),
                inset 0 1px 1px var(--glass-highlight), /* 顶部高光 */
                inset 0 -1px 1px rgba(0,0,0,0.1);       /* 底部暗角 */
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* 玻璃反光伪元素 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        /* ================= 实时运行面板 ================= */
        .panel-header {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 12px;
            border-radius: 20px;
        }

        .dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--accent);
        }

        /* ================= 环形核心视觉 ================= */
        .circle-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0 40px;
        }

        .circle-wrap {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-wrap svg {
            position: absolute;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255,255,255,0.05);
            stroke-width: 14;
        }

        .circle-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 628; /* 2 * pi * 100 */
            stroke-dashoffset: 150; /* 进度 */
            filter: drop-shadow(0 0 15px var(--accent)) drop-shadow(0 0 5px var(--accent));
            transition: stroke 0.5s ease;
        }

        /* 内侧玻璃反光罩 */
        .circle-inner-glass {
            position: absolute;
            width: 160px; height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .power-text {
            text-align: center;
            z-index: 2;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .power-value {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            background: linear-gradient(180deg, #fff, #ddd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .power-unit {
            font-size: 16px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 600;
        }

        .btn-unlimited {
            margin-top: 20px;
            background: var(--accent-bg);
            color: var(--accent);
            padding: 10px 32px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 0 var(--glass-highlight);
        }

        /* ================= 数据网格 ================= */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 14px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            border-radius: 22px;
        }

        .data-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .data-label {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* 主电池信息卡片 */
        .battery-main-card {
            padding: 16px 10px;
            margin-bottom: 14px;
            border-radius: 24px;
        }

        /* ================= 底部悬浮导航 ================= */
        .bottom-nav {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            height: 74px;
            background: var(--nav-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 37px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 
                0 15px 35px -5px rgba(0,0,0,0.4),
                inset 0 1px 0 var(--glass-highlight);
            z-index: 20;
            transition: all 0.5s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-sub);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--accent);
            transform: translateY(-2px);
        }

        .nav-item.active svg {
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: 0.3s;
        }

        /* ================= 主题切换悬浮按钮 ================= */
        .theme-switcher {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 999;
            background: rgba(20, 20, 20, 0.6);
            padding: 10px 18px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .theme-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .theme-btn:hover { transform: scale(1.15); }
        .theme-btn.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .btn-aurora { background: linear-gradient(135deg, #ff00cc, #3333ff, #00ffff); }
        .btn-cyber { background: linear-gradient(135deg, #000, #00ff88); }
        .btn-lava { background: linear-gradient(135deg, #ff3300, #ffaa00, #6600ff); }

    </style>
</head>
<body class="theme-aurora">

    <!-- 绚丽动态背景层 -->
    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 主题切换器 -->
    <div class="theme-switcher">
        <div class="theme-btn btn-aurora active" onclick="setTheme('theme-aurora', this)"></div>
        <div class="theme-btn btn-cyber" onclick="setTheme('theme-cyber', this)"></div>
        <div class="theme-btn btn-lava" onclick="setTheme('theme-lava', this)"></div>
    </div>

    <!-- 手机应用容器 -->
    <div class="app-container">
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>20:24</span>
            <div style="display:flex; gap:6px; align-items:center;">
                <span>5G</span>
                <span>🔋 89</span>
            </div>
        </div>

        <!-- 头部 -->
        <div class="header">
            <h1>HyperOS - 动态温控</h1>
            <p>心之所向的你 是否也于我同频</p>
        </div>

        <!-- 滚动内容区 -->
        <div class="content">
            
            <!-- 实时运行面板 -->
            <div class="glass-card panel-header">
                <div class="dot"></div>
                <span>实时运行面板</span>
            </div>

            <!-- 环形主视图 -->
            <div class="circle-section">
                <div class="circle-wrap">
                    <svg width="220" height="220">
                        <circle class="circle-bg" cx="110" cy="110" r="100"></circle>
                        <circle class="circle-progress" cx="110" cy="110" r="100"></circle>
                    </svg>
                    <div class="circle-inner-glass"></div>
                    <div class="power-text">
                        <div class="power-value">5.2</div>
                        <div class="power-unit">W</div>
                    </div>
                </div>
                <button class="btn-unlimited">无限制</button>
            </div>

            <!-- 电量与状态 -->
            <div class="grid-2">
                <div class="glass-card data-item">
                    <span class="data-val">100</span>
                    <span class="data-label">电量 %</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">放电中</span>
                    <span class="data-label">状态</span>
                </div>
            </div>

            <!-- 容量信息 -->
            <div class="glass-card grid-3 battery-main-card">
                <div class="data-item">
                    <span class="data-val">6100</span>
                    <span class="data-label">设计容量 mAh</span>
                </div>
                <div class="data-item">
                    <span class="data-val">5001</span>
                    <span class="data-label">满充容量 mAh</span>
                </div>
                <div class="data-item">
                    <span class="data-val">82</span>
                    <span class="data-label">健康度 %</span>
                </div>
            </div>

            <!-- 实时参数 -->
            <div class="grid-3">
                <div class="glass-card data-item">
                    <span class="data-val">4.556</span>
                    <span class="data-label">电压 V</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">1.13</span>
                    <span class="data-label">电流 A</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">41.6</span>
                    <span class="data-label">温度 °C</span>
                </div>
            </div>

            <!-- 电池其他信息 -->
            <div class="grid-3">
                <div class="glass-card data-item">
                    <span class="data-val">733</span>
                    <span class="data-label">循环次数</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">1</span>
                    <span class="data-label">伪装次数</span>
                </div>
                <div class="glass-card data-item">
                    <span class="data-val">PPS</span>
                    <span class="data-label">充电协议</span>
                </div>
            </div>

        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l7.2 14.2H4.8L12 5.8z"/></svg>
                <span>主页</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 16a4 4 0 100-8 4 4 0 000 8zm0 2a6 6 0 110-12 6 6 0 010 12zm0-16a6 6 0 110 12 6 6 0 010-12z"/></svg>
                <span>温控</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 4h-2V2H9v2H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V6a2 2 0 00-2-2zm-2 14H9v-2h6v2zm0-4H9v-2h6v2zm0-4H9V8h6v2z"/></svg>
                <span>电池</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2a8 8 0 100-16 8 8 0 000 16zm-3-8a2 2 0 110-4 2 2 0 010 4zm6 0a2 2 0 110-4 2 2 0 010 4z"/></svg>
                <span>外观</span>
            </div>
            <div class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span>关于</span>
            </div>
        </div>

    </div>

    <!-- 切换主题的JS逻辑 -->
    <script>
        function setTheme(themeName, btnElement) {
            // 移除 body 上的所有主题类
            document.body.className = themeName;
            
            // 更新按钮激活状态
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>
</body>
</html>
