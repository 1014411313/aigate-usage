<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>背屏电池卡片</title>
<style>
  :root{
    --accent-rgb:245,158,11;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body{ font-family:var(--font); color:#fff; }

  /* 设计稿 976×596，按实际视口等比缩放 */
  #screen{
    position:absolute; left:0; top:0;
    width:976px; height:596px;
    transform-origin:top left;
    background:#000; color:#fff; overflow:hidden;
    font-variant-numeric:tabular-nums;
  }

  /* ===== 2×2 面板 ===== */
  .board{ position:absolute; left:296px; top:0; width:680px; height:596px; background:#000; }
  .panel{ position:absolute; width:340px; height:298px; background:#000; overflow:hidden; }
  .panel.tl{ left:0; top:0; border-right:1px solid rgba(255,255,255,.06); border-bottom:1px solid rgba(255,255,255,.06); }
  .panel.tr{ right:0; top:0; border-bottom:1px solid rgba(255,255,255,.06); }
  .panel.bl{ left:0; bottom:0; border-right:1px solid rgba(255,255,255,.06); }
  .panel.br{ right:0; bottom:0; }

  .data-box{
    position:absolute; padding:36px 44px;
    display:flex; flex-direction:column; gap:6px; z-index:2;
  }
  .panel.tl .data-box{ left:0; top:0; align-items:flex-start; }
  .panel.tr .data-box{ right:0; top:0; align-items:flex-end; }
  .panel.bl .data-box{ left:0; bottom:0; align-items:flex-start; }
  .panel.br .data-box{ right:0; bottom:0; align-items:flex-end; }

  .d-head{
    display:flex; align-items:center; gap:10px;
    font-size:calc(17px * var(--fs,1)); color:rgba(255,255,255,.45);
    letter-spacing:.15em; white-space:nowrap;
  }
  .d-head svg{
    width:22px; height:22px; flex:0 0 auto;
    color:rgb(var(--accent-rgb)); fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),.8));
  }
  .d-val{ display:flex; align-items:baseline; gap:5px; }
  .d-val b{
    font-size:calc(46px * var(--fs,1)); font-weight:500; line-height:1;
    color:#fff; letter-spacing:-.03em;
    text-shadow:0 4px 12px rgba(0,0,0,.8);
  }
  .d-val em{
    font-style:normal; font-size:calc(20px * var(--fs,1)); font-weight:400;
    color:rgba(255,255,255,.35); margin-left:2px;
  }

  /* ===== 顶部状态胶囊 ===== */
  .top-status{ position:absolute; left:636px; top:32px; transform:translateX(-50%); z-index:20; }
  .status-pill{
    display:inline-flex; align-items:center; gap:8px;
    height:38px; padding:0 20px; border-radius:100px;
    border:1px solid rgba(var(--accent-rgb),.5);
    background:#000; color:rgb(var(--accent-rgb));
    font-size:calc(16px * var(--fs,1)); letter-spacing:.12em;
    transition:border-color .4s ease, color .4s ease;
    box-shadow:0 4px 20px rgba(0,0,0,.9);
  }
  .status-pill .dot-pulse{
    width:8px; height:8px; border-radius:50%;
    background:rgb(var(--accent-rgb));
    box-shadow:0 0 8px rgba(var(--accent-rgb),.9);
    animation:pillPulse 1.8s ease-in-out infinite;
  }
  @keyframes pillPulse{ 0%,100%{ opacity:.35; transform:scale(.8) } 50%{ opacity:1; transform:scale(1.15) } }
  .status-pill.idle{ border-color:rgba(255,255,255,.16); color:rgba(255,255,255,.5); }
  .status-pill.idle .dot-pulse{ background:rgba(255,255,255,.5); box-shadow:none; animation:none; opacity:.7; }

  /* ===== 光环 ===== */
  .gauge-wrap{
    position:absolute; left:636px; top:298px; width:440px; height:440px;
    transform:translate(-50%,-50%);
    display:flex; justify-content:center; align-items:center;
    z-index:10; pointer-events:none;
  }
  .gauge{
    position:relative; width:166px; height:166px;
    transform:scale(2.6506);
    display:grid; place-items:center;
  }
  .gauge svg.ring{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; z-index:2; }
  .track{ fill:none; stroke:rgba(255,255,255,.1); stroke-width:12; }
  .arc{
    fill:none; stroke:url(#gaugeGrad); stroke-width:12; stroke-linecap:round;
    stroke-dasharray:100; stroke-dashoffset:calc(100 - var(--p, 0));
    filter:drop-shadow(0 0 5px rgba(var(--accent-rgb),.6));
    transition:stroke-dashoffset .6s ease;
  }
  .spark{
    fill:none; stroke:#fff; stroke-opacity:.85; stroke-width:12; stroke-linecap:round;
    stroke-dasharray:.01 99.99; stroke-dashoffset:calc(100 - var(--p, 0));
    filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.9));
  }
  .gauge.charg .spark{ animation:sparkPulse 1.9s ease-in-out infinite; }
  @keyframes sparkPulse{ 0%,100%{ stroke-width:11; opacity:.7 } 50%{ stroke-width:15; opacity:1 } }

  .glow{
    position:absolute; width:162px; height:162px; border-radius:50%; z-index:0;
    background:radial-gradient(circle, rgba(var(--accent-rgb),.6) 0%, rgba(var(--accent-rgb),.42) 28%, rgba(var(--accent-rgb),.2) 48%, rgba(var(--accent-rgb),.06) 62%, rgba(var(--accent-rgb),0) 74%);
    opacity:0; filter:blur(4px); pointer-events:none;
    animation:glowBreath 3.2s infinite alternate ease-in-out;
    transition:opacity 1.2s ease;
  }
  .gauge.charg .glow{ opacity:1; }
  @keyframes glowBreath{ 0%{ transform:scale(.92) } 100%{ transform:scale(1.08) } }

  .fluid{
    position:absolute; width:150px; height:150px; border-radius:50%; overflow:hidden; z-index:1;
    -webkit-clip-path:circle(50%); clip-path:circle(50%);
    box-shadow:inset 0 0 10px rgba(var(--accent-rgb),.1);
    background:#000;
  }
  .fill{
    position:absolute; left:0; bottom:0; width:100%; height:calc(var(--p, 0) * 1%); overflow:hidden;
    background:linear-gradient(to top, rgba(var(--accent-rgb),.38) 0%, rgba(var(--accent-rgb),.05) 100%);
    transition:height .8s cubic-bezier(.32,.72,0,1);
  }
  .blob{
    position:absolute; width:200%; height:200%; top:-30%; left:-50%; border-radius:40%;
    background:radial-gradient(circle, rgba(var(--accent-rgb),.8) 0%, transparent 60%);
    filter:blur(15px); mix-blend-mode:screen; animation:blobSpin 6s linear infinite;
  }
  .blob.b2{ border-radius:38%; background:radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 60%); animation:blobSpin 10s linear infinite reverse; }
  @keyframes blobSpin{ 100%{ transform:rotate(360deg) } }

  .wave{ position:absolute; left:0; width:100%; z-index:3; bottom:calc(var(--p, 0) * 1% - 14px); transition:bottom .8s cubic-bezier(.32,.72,0,1); animation:waveBob 6s ease-in-out infinite alternate; }
  .wave svg{ position:absolute; left:0; top:0; width:300%; height:100%; display:block; }
  .w1{ height:28px; z-index:2; }
  .w1 svg{ animation:waveSlide 7s linear infinite; }
  .w2{ height:26px; z-index:4; }
  .w2 svg{ animation:waveSlide 10s linear infinite reverse; }
  .w3{ height:32px; z-index:3; }
  .w3 svg{ animation:waveSlide 13s linear infinite; }
  @keyframes waveSlide{ from{ transform:translateX(0) } to{ transform:translateX(-33.3333%) } }
  @keyframes waveBob{ from{ transform:translateY(-1.5px) } to{ transform:translateY(1.5px) } }

  .hole{ position:relative; z-index:5; text-align:center; }
  .bolt{ width:26px; height:26px; margin:0 auto 6px; color:rgb(var(--accent-rgb)); opacity:0; transform:translateY(3px) scale(.85); transition:opacity .3s ease, transform .3s ease; }
  .bolt svg{ width:100%; height:100%; display:block; fill:currentColor; }
  .gauge.charg .bolt{ opacity:1; transform:none; }
  .pw{ font-size:72px; font-weight:300; letter-spacing:-4px; line-height:1; color:#fff; }
  .unit{ font-size:18px; color:rgba(255,255,255,.55); margin-top:8px; letter-spacing:.08em; }

  @media (prefers-reduced-motion: reduce){
    .glow,.spark,.blob,.wave,.dot-pulse{ animation:none !important; }
    .arc,.fill,.wave{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="screen">
  <div class="board">
    <div class="panel tl"><div class="data-box"><div class="d-head"><span class="ico"></span><span class="lb">--</span></div><div class="d-val"><b class="vv">--</b><em class="uu"></em></div></div></div>
    <div class="panel tr"><div class="data-box"><div class="d-head"><span class="ico"></span><span class="lb">--</span></div><div class="d-val"><b class="vv">--</b><em class="uu"></em></div></div></div>
    <div class="panel bl"><div class="data-box"><div class="d-head"><span class="ico"></span><span class="lb">--</span></div><div class="d-val"><b class="vv">--</b><em class="uu"></em></div></div></div>
    <div class="panel br"><div class="data-box"><div class="d-head"><span class="ico"></span><span class="lb">--</span></div><div class="d-val"><b class="vv">--</b><em class="uu"></em></div></div></div>
  </div>

  <div class="gauge-wrap">
    <div class="gauge" id="gauge">
      <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
        <defs>
          <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgb(var(--accent-rgb))"/>
            <stop offset="55%" stop-color="#fff" stop-opacity=".75"/>
            <stop offset="100%" stop-color="rgb(var(--accent-rgb))" stop-opacity=".55"/>
          </linearGradient>
        </defs>
        <circle class="track" cx="120" cy="120" r="100"/>
        <circle class="arc" cx="120" cy="120" r="100" pathLength="100" transform="rotate(-90 120 120)"/>
        <circle class="spark" cx="120" cy="120" r="100" pathLength="100" transform="rotate(-90 120 120)"/>
      </svg>
      <div class="glow"></div>
      <div class="fluid">
        <div class="fill"><i class="blob"></i><i class="blob b2"></i></div>
        <div class="wave w1"><svg viewBox="0 0 546 28" preserveAspectRatio="none"><path fill="rgb(var(--accent-rgb))" fill-opacity=".7" d="M0 14 Q45.5 0 91 14 T182 14 T273 14 T364 14 T455 14 T546 14 L546 28 L0 28 Z"/></svg></div>
        <div class="wave w3"><svg viewBox="0 0 546 32" preserveAspectRatio="none"><path fill="rgb(var(--accent-rgb))" fill-opacity=".28" d="M0 16 Q45.5 -2 91 16 T182 16 T273 16 T364 16 T455 16 T546 16 L546 32 L0 32 Z"/></svg></div>
        <div class="wave w2"><svg viewBox="0 0 546 26" preserveAspectRatio="none"><path fill="#fff" fill-opacity=".3" d="M0 13 Q45.5 3 91 13 T182 13 T273 13 T364 13 T455 13 T546 13 L546 26 L0 26 Z"/></svg></div>
      </div>
      <div class="hole">
        <div class="bolt"><svg viewBox="0 0 24 24"><path d="M13 2 4.6 13.4h6.1l-1 8.6 8.7-11.6H13z"/></svg></div>
        <div class="pw" id="vPow">--</div>
        <div class="unit">W</div>
      </div>
    </div>
  </div>

  <div class="top-status">
    <div class="status-pill" id="pill"><i class="dot-pulse"></i><span id="pillText">--</span></div>
  </div>
</div>

<script>
(function(){
  var ICONS = {
    temp:'<path d="M12 3.2a2 2 0 0 1 2 2v8.1a4.2 4.2 0 1 1-4 0V5.2a2 2 0 0 1 2-2Z"/><path d="M12 9v5.6"/>',
    soc:'<rect x="2.4" y="6.6" width="16.2" height="10.8" rx="3"/><path d="M21.4 10.2v3.6"/><path d="M6.2 10.4v3.2"/><path d="M9.6 10.4v3.2"/>',
    volt:'<path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/>',
    cur:'<path d="M2.5 12c2.4-5.2 4.8-5.2 7.2 0s4.8 5.2 7.2 0"/>',
    power:'<circle cx="12" cy="12" r="9"/><path d="M12.8 7 9 12.6h3.4l-.7 4.4 3.8-5.6h-3.4z"/>',
    status:'<circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.6 2.6 5-5.2"/>',
    des:'<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/>',
    full:'<rect x="2.4" y="6.6" width="16.2" height="10.8" rx="3"/><path d="M21.4 10.2v3.6"/><path d="M5.6 10.2v3.6h9v-3.6z"/>',
    health:'<path d="M12 20.4S3.8 15.6 3.8 9.9a4.2 4.2 0 0 1 8.2-1 4.2 4.2 0 0 1 8.2 1c0 5.7-8.2 10.5-8.2 10.5Z"/>',
    cycle:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V9h-4.5"/>',
    fake:'<path d="M2.5 15c2.4-4.6 4.8-4.6 7.2 0s4.8 4.6 7.2 0"/><path d="M2.5 9h3.2"/>',
    proto:'<path d="M9 3v5"/><path d="M15 3v5"/><path d="M7 8h10v3a5 5 0 0 1-10 0z"/><path d="M12 16v5"/>',
    rm:'<rect x="2.5" y="8" width="17" height="8" rx="2.4"/><path d="M6 11.4v1.2"/><path d="M9.4 11.4v1.2"/><path d="M5.5 15.6v2"/><path d="M16.5 15.6v2"/>',
    soh:'<path d="M2.5 12h4l2-4 3 8 2.6-5 1.8 3h5.6"/>'
  };
  var LABELS = {
    temp:['温度','℃'], soc:['电量','%'], volt:['电压','V'], cur:['电流','A'],
    power:['功率','W'], status:['状态',''], des:['设计容量','mAh'], full:['满充容量','mAh'],
    health:['健康度','%'], cycle:['循环','次'], fake:['伪装','次'], proto:['协议',''],
    rm:['剩余容量','mAh'], soh:['电池寿命','%']
  };
  var DEFAULT_FIELDS = ['temp','soc','volt','cur'];
  var STATUS_CN = { Charging:'充电中', Discharging:'放电中', Full:'已充满', 'Not charging':'未充电' };

  var screen = document.getElementById('screen');
  var gauge = document.getElementById('gauge');
  var pill = document.getElementById('pill');
  var pillText = document.getElementById('pillText');
  var powEl = document.getElementById('vPow');
  var boxes = {};
  ['tl','tr','bl','br'].forEach(function(k){
    var p = document.querySelector('.panel.' + k);
    boxes[k] = { lb:p.querySelector('.lb'), ico:p.querySelector('.ico'), vv:p.querySelector('.vv'), uu:p.querySelector('.uu') };
  });

  var fieldsKey = '';
  var data = {};

  function fit(){
    var s = Math.min((window.innerWidth || 976) / 976, (window.innerHeight || 596) / 596);
    screen.style.transform = 'scale(' + s + ')';
  }

  function splitVal(key, v){
    if (v === undefined || v === null || v === '') return ['--',''];
    if (key === 'status') return [STATUS_CN[v] || v, ''];
    if (key === 'proto') return [String(v), ''];
    if (typeof v === 'number') {
      if (key === 'volt') return [v.toFixed(3), LABELS[key][1]];
      if (key === 'cur' || key === 'power') return [Math.abs(v).toFixed(2), LABELS[key][1]];
      if (key === 'temp') return [v.toFixed(1), LABELS[key][1]];
      if (key === 'soc' || key === 'health' || key === 'soh') return [String(Math.round(v)), LABELS[key][1]];
      return [String(v), LABELS[key][1]];
    }
    return [String(v), LABELS[key][1]];
  }

  function renderFields(list){
    var keys = ['tl','tr','bl','br'];
    keys.forEach(function(k, i){
      var key = list[i] || DEFAULT_FIELDS[i];
      var box = boxes[k];
      box.key = key;
      var lab = LABELS[key] || ['--',''];
      box.lb.textContent = lab[0];
      box.ico.innerHTML = '<svg viewBox="0 0 24 24">' + (ICONS[key] || '') + '</svg>';
    });
  }

  function apply(d){
    if (!d) return;
    data = d;
    var scale = Number(d.font_scale || 1);
    document.documentElement.style.setProperty('--fs', String(Math.max(.7, Math.min(1.5, scale))));
    document.documentElement.setAttribute('data-theme', d.theme || 'aurora');

    if (d.accent) {
      document.documentElement.style.setProperty('--accent-rgb', d.accent);
    }

    var list = (d.fields && d.fields.length === 4) ? d.fields : DEFAULT_FIELDS;
    var key = list.join(',');
    if (key !== fieldsKey) { fieldsKey = key; renderFields(list); }

    ['tl','tr','bl','br'].forEach(function(k){
      var box = boxes[k];
      if (!box.key) return;
      var pair = splitVal(box.key, d[box.key]);
      if (box.vv.textContent !== pair[0]) box.vv.textContent = pair[0];
      if (box.uu.textContent !== pair[1]) box.uu.textContent = pair[1];
    });

    var soc = (typeof d.soc === 'number') ? Math.max(0, Math.min(100, d.soc)) : 0;
    gauge.style.setProperty('--p', soc.toFixed(1));

    var charging = !!d.charging;
    gauge.classList.toggle('charg', charging);

    var st = d.status ? (STATUS_CN[d.status] || d.status) : '--';
    pillText.textContent = st;
    pill.classList.toggle('idle', !charging);

    var pw = (typeof d.power === 'number') ? d.power : null;
    powEl.textContent = pw === null ? '--' : (pw >= 0 ? '+' : '-') + Math.abs(pw).toFixed(2);
  }

  window.addEventListener('resize', fit);
  fit();
  window.__rear = apply;
  if (window.__REAR_DATA) apply(window.__REAR_DATA);
})();
</script>
</body>
</html>
