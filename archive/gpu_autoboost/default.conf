# GPU 智能升频 · 配置文件
#
# 安装后会被复制到 /data/adb/gpu_autoboost/config.conf。
# 放在模块目录之外，是为了升级模块时不覆盖你的设置。
# 改完不用重启：守护按 mtime 巡检，一个周期内自动重载。

# ── 采样 ──────────────────────────────────────────────────────
# 采样间隔（毫秒）。读的是 gpu_busy_percentage（真实繁忙度），
# 不是 devfreq/gpu_load —— 后者在本机上只有真实值的 1/3~1/5，
# msm-adreno-tz 正是被它误导才不升频的。
# 50 ~ 2000
INTERVAL_MS=300

# ── 负载阈值（滞回） ──────────────────────────────────────────
# 繁忙度超过 BUSY_HIGH 且连续 HOLD_UP 次采样 → 升一档（pwrlevel 减 1）
# 低于 BUSY_LOW 且连续 HOLD_DOWN 次采样 → 降一档（pwrlevel 加 1）
# 中间是滞回带，不做动作，避免抖动。
BUSY_HIGH=65
BUSY_LOW=35
HOLD_UP=4
HOLD_DOWN=10

# ── 档位范围 ──────────────────────────────────────────────────
# pwrlevel 越小频率越高。本机 14 档：0=1100MHz，12=222MHz，13=160MHz。
# 系统的 min_pwrlevel 默认就是 12，所以 13 档实际用不到。
# LEVEL_MIN 是升频的天花板（越小越激进），LEVEL_MAX 是省电的地板。
LEVEL_MIN=1
LEVEL_MAX=12
LEVEL_START=12

# ── 温度保护 ──────────────────────────────────────────────────
# 读 GPU 自己的温度节点（毫摄氏度）。超过 TH_HIGH 强制压到 LEVEL_THERMAL，
# 回到 TH_LOW 以下才逐步放开。TH_HIGH 必须大于 TH_LOW。
TH_CAP=1
TH_HIGH=75
TH_LOW=68
LEVEL_THERMAL=8

# ── 熄屏 ──────────────────────────────────────────────────────
# 1 = 熄屏回到 LEVEL_MAX，不白耗电
SCREEN_IDLE=1

# ── 游戏名单 ────────────────────────────────────────────────
# 名单里的应用在前台时，不等负载爬升，直接拉到 GAME_LEVEL。
# 名单文件：/data/adb/gpu_autoboost/games.conf（一行一个包名）
# WebUI「学习」页可以维护。温控仍然优先：过热时照常压档。
GAME_BOOST=1
# 游戏时锁到的档位。1 = 接近最高频，不想太激进就改大一点。
# 范围 LEVEL_MIN ~ LEVEL_MAX
GAME_LEVEL=1

# ── 学习 ──────────────────────────────────────────────────────
# 1 = 记录每个前台应用稳定后的档位与负载，WebUI 据此给建议
LEARN=1
# 样本落盘间隔（秒）
LEARN_FLUSH_S=300
# 采样时忽略的包名（前台判定用，逗号分隔），一般不用填
LEARN_SKIP=

# ── 检查更新 ────────────────────────────────────────
# 更新源地址。留空 = 不检查（模块不会主动联网）。
# 清单是纯文本，每行 key=value：
#   version=V1.2
#   versionCode=102
#   url=https://example.com/gpu_autoboost-v1.2.zip
#   note=这一版改了什么
# 对比 versionCode 判断是否有新版本；模块只提示，不自动下载安装。
UPDATE_URL=
